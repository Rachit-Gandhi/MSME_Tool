name: Build Windows exe

# PyInstaller cannot cross-compile, so the Windows binary is built on a Windows
# runner. A normal push uploads the exe as a build artifact; pushing a version
# tag (e.g. v1.0.0) additionally publishes it as a GitHub Release.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # ships tkinter on the windows-latest runner

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build exe
        run: pyinstaller build.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: msme-tool-windows
          path: dist/msme-tool.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }} dist/msme-tool.exe
          --title "${{ github.ref_name }}"
          --notes "Standalone Windows build of the MSME 43B(h) tool (GUI). Download msme-tool.exe below; no Python install required. Bank rates, opening-balance expiry days and agreed days are all editable inside the app."
