name: Build Windows exe

# PyInstaller cannot cross-compile, so the Windows binary is built on a Windows
# runner. Trigger it by pushing, or run it manually from the Actions tab.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # ships tkinter on the windows-latest runner

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build exe
        run: pyinstaller build.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: msme-tool-windows
          path: dist/msme-tool.exe
